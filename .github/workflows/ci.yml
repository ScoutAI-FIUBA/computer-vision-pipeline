name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      # The tests never call the hosted models; the value only has to be present.
      ROBOFLOW_API_KEY: test-only-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests with coverage
        run: pytest -q --cov=pipeline --cov=api --cov=modal_app_v2 --cov=modal_app_v2_service --cov-report=term --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
